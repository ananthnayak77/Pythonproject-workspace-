<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🎲 Dice Simulator Game</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 15px;
      width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      margin-bottom: 20px;
      font-size: 2em;
      letter-spacing: 2px;
    }
    input {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 1em;
    }
    button {
      background: #ff4b2b;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      color: #fff;
      font-size: 1em;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #ff416c;
      transform: scale(1.05);
    }
    .output {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      text-align: left;
      max-height: 200px;
      overflow-y: auto;
    }
    .round {
      margin: 5px 0;
      padding: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎲 Dice Simulator</h1>
    <input type="number" id="rounds" placeholder="Enter number of rounds">
    <input type="number" id="target" placeholder="Enter target score">
    <button onclick="startGame()">Start Game</button>
    <div class="output" id="output"></div>
  </div>

  <script>
    async function startGame() {
      const rounds = document.getElementById('rounds').value;
      const target = document.getElementById('target').value;
      const output = document.getElementById('output');
      output.innerHTML = "<p>Rolling dice...</p>";

      // Example: sending data to Python backend (Flask/FastAPI)
      const response = await fetch('/play', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rounds: rounds, target_score: target })
      });
      const data = await response.json();

      output.innerHTML = "";
      data.history.forEach((roll, index) => {
        output.innerHTML += `<div class="round">Round ${index+1}: You rolled a ${roll}</div>`;
      });
      output.innerHTML += `<p><strong>${data.message}</strong></p>`;
    }
  </script>
</body>
</html>
